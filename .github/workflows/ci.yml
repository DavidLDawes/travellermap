name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    name: JavaScript lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  data-linux:
    # Builds the portable core (core/Maps.Core.csproj) on .NET 10 and validates all sector
    # data with it on Linux, which also catches file-name case mismatches (Linux paths are
    # case-sensitive).
    name: Data validation (.NET 10, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate sector data
        run: dotnet run -c Debug --project tools/validate

  host-linux:
    # Runs the site on the .NET 10 host (host/) on Linux and the browser suites against it:
    # routes, content negotiation, and rendering (SkiaSharp with the bundled fonts, PDFsharp).
    name: .NET 10 host on Linux, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build host
        run: dotnet build host -c Debug
      # (The host would also build it on first start; this checks the tool.)
      - name: Build search index
        run: dotnet run --project tools/reindex
      - name: Browser tests
        run: |
          dotnet host/bin/Debug/net10.0/Maps.Host.dll --urls http://localhost:5080 > host.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:5080/api/search?q=Regina" && break
            sleep 2
          done
          node test/run-browser-tests.mjs --base http://localhost:5080 --save-images image-diffs
      - name: Host log
        if: always()
        run: cat host.log || true
      - name: Upload differing images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-diffs-linux
          path: image-diffs/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    # Builds the deployable image (Dockerfile) and runs the browser suites against it.
    name: Docker image, browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build image
        run: docker build -t travellermap .
      - name: Browser tests
        run: |
          # Host networking, so the tests' requests are local (as for the admin pages).
          docker run -d --name travellermap --network host -e ASPNETCORE_HTTP_PORTS=8080 travellermap
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:8080/api/search?q=Regina" && break
            sleep 2
          done
          node test/run-browser-tests.mjs --base http://localhost:8080 --save-images image-diffs
      - name: Container log
        if: always()
        run: docker logs travellermap || true
      - name: Upload differing images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-diffs-docker
          path: image-diffs/
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Build, unit tests, data validation
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      - name: Restore
        run: msbuild Maps.sln -t:Restore -v:minimal

      # Debug, so the sector parser records world-level errors for data validation.
      - name: Build
        run: msbuild Maps.sln -p:Configuration=Debug -v:minimal

      # Includes DataValidationTest, which fails on data errors not in
      # test/data-validation-baseline.txt.
      - name: Unit tests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "**\vstest.console.exe" | Select-Object -First 1
          & $vstest unittests\UnitTests\bin\Debug\UnitTests.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Browser tests (if IIS Express is available)
        shell: pwsh
        run: |
          $iis = "$env:ProgramFiles\IIS Express\iisexpress.exe"
          if (-not (Test-Path $iis)) {
            Write-Output "::notice::IIS Express not installed on this runner; skipping browser tests."
            exit 0
          }
          Copy-Item Web.config.sample web.config
          $site = Start-Process $iis -ArgumentList "/path:$PWD", "/port:50103", "/systray:false" -PassThru
          try {
            $ready = $false
            # Waits for search too: the site builds its search index on first start.
            foreach ($i in 1..90) {
              try {
                Invoke-WebRequest "http://localhost:50103/api/search?q=Regina" -UseBasicParsing -TimeoutSec 30 | Out-Null
                $ready = $true; break
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $ready) { Write-Error "Site did not start"; exit 1 }
            # Images use grayscale text and ImageTest tolerates anti-aliasing jitter, so it
            # passes across machines. If it fails, the differing images are uploaded as the
            # image-diffs artifact.
            node test/run-browser-tests.mjs --save-images image-diffs
            exit $LASTEXITCODE
          } finally {
            Stop-Process -Id $site.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload differing images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-diffs
          path: image-diffs/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    # Deploys the Docker image to Cloud Run (see deploy/README.md). Only for pushes to main, only
    # when every job above passed, and only once deploy/setup.sh has set the repository variables
    # (until GCP_PROJECT_ID exists this job is skipped). Authenticates without stored keys.
    name: Deploy to Cloud Run
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    needs: [javascript, data-linux, host-linux, docker, windows]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.GCP_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_REGISTRY }}/site
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy
        # Public access is deliberately not set here: it is set once by `deploy/setup.sh live`, and
        # the cost-alert responder removes it at 100% of budget. A deploy must not undo that.
        # AdminKey comes from Secret Manager; it never passes through GitHub. The instance size is
        # also passed to the app, so /admin/usage can turn busy time into vCPU- and GiB-seconds.
        env:
          CPU: "1"
          MEMORY_GIB: "1"
          MAX_INSTANCES: "2"
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT" --region "$REGION" \
            --image "$IMAGE:$GITHUB_SHA" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --port 8080 --cpu "$CPU" --memory "${MEMORY_GIB}Gi" --cpu-boost --concurrency 20 --timeout 120 \
            --min-instances 0 --max-instances "$MAX_INSTANCES" \
            --set-env-vars "ASPNETCORE_FORWARDEDHEADERS_ENABLED=true,RedirectToHttps=true,GIT_SHA=$GITHUB_SHA,DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ),GCP_PROJECT_ID=$PROJECT,CLOUD_RUN_VCPU=$CPU,CLOUD_RUN_MEMORY_GIB=$MEMORY_GIB,CLOUD_RUN_MAX_INSTANCES=$MAX_INSTANCES" \
            --set-secrets "AdminKey=admin-key:latest" \
            --labels "commit=${GITHUB_SHA::12}"
      - name: Smoke test
        run: |
          url=$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format 'value(status.url)')
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 --retry 5 --retry-delay 5 --retry-all-errors "$url/api/search?q=Regina")
          if [ "$code" = 403 ]; then
            echo "::warning::$url answers 403: the service is private (not yet made live, or cut off by the cost alert). Skipping the smoke test."
            exit 0
          fi
          [ "$code" = 200 ] || { echo "::error::search returned $code"; exit 1; }
          curl -sf --max-time 120 -o poster.pdf "$url/api/poster?sector=Spinward%20Marches&subsector=C&accept=application/pdf"
          [ "$(head -c 4 poster.pdf)" = "%PDF" ] || { echo "::error::poster is not a PDF"; exit 1; }
          echo "Deployed $url at $GITHUB_SHA"
